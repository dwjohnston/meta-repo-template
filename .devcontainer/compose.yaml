# Static part of the dev container's Compose config, shared by everyone.
#
# Everything host- or person-specific (your repos, separate_mounts,
# persistent_volumes, env, proxies, volume names) lives in compose.local.yaml,
# which ./apply.sh generates from meta-repo.yaml + meta-repo.local.yaml.
# Relative paths here are relative to this .devcontainer/ directory.
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    # A few common dev-server ports, published on host port + 10000,
    # e.g. container 5173 -> host 15173. Kept to a short list because publishing
    # a large range makes container startup very slow.
    # Servers must listen on 0.0.0.0 inside the container; a process bound to
    # 127.0.0.1 won't receive this.
    ports:
      - "127.0.0.1:13000-13003:3000-3003"
      - "127.0.0.1:18000-18003:8000-8003"
      - "127.0.0.1:14173:4173"
      - "127.0.0.1:15173:5173"
    volumes:
      # Read-only copies of the environment definition, so agents can see how
      # their environment is built. compose.local.yaml is deliberately excluded
      # because it contains host paths.
      - type: bind
        source: ./Dockerfile
        target: /workspace/.workspace/Dockerfile
        read_only: true
      - type: bind
        source: ./devcontainer.json
        target: /workspace/.workspace/devcontainer.json
        read_only: true
      - type: bind
        source: ./compose.yaml
        target: /workspace/.workspace/compose.yaml
        read_only: true

      # Shared skills, read-write so host edits show up live and agents can
      # edit their own skills. Also exposed where Claude Code looks for skills.
      - type: bind
        source: ../.agents
        target: /workspace/.agents
      - type: bind
        source: ../.agents/skills
        target: /workspace/.claude/skills

      # Persisted agent conversations/state. Only these specific paths are
      # persisted, never all of ~/.vscode-server (extension version conflicts).
      - type: volume
        source: copilot
        target: /home/vscode/.copilot
      - type: volume
        source: vscode-agent-sessions
        target: /home/vscode/.vscode-server/data/agentSessionData
      - type: volume
        source: vscode-global-storage
        target: /home/vscode/.vscode-server/data/User/globalStorage
      - type: volume
        source: claude
        # Also holds .claude.json; the entrypoint symlinks ~/.claude.json here.
        target: /home/vscode/.claude
      - type: volume
        source: dsh
        # Includes session transcripts under sessions/ and diagnostics under logs/.
        target: /home/vscode/.dsh

# compose.local.yaml gives each of these an explicit name prefixed with
# metarepo_id, so separate meta-repos never share volumes.
volumes:
  copilot:
  vscode-agent-sessions:
  vscode-global-storage:
  claude:
  dsh:
