# Shared meta-repo config, committed and the same for the whole team.
#
# Per-person values (root, env values, proxies, extra folders) go in
# meta-repo.local.yaml. Copy meta-repo.local.yaml.template to get started.
# After changing either file, run ./apply.sh and rebuild the container.

# The human part of the Compose project name and the prefix on all volume names.
# Lowercase letters, digits, - and _.
metarepo_id: "meta-repo-template"

# Optional. Appended to make the Compose project name `metarepo_id-metarepo_suffix`,
# so two checkouts of the same meta-repo never share volumes. Unset, a hash of this
# checkout's path is used: stable while the directory stays put, different for every
# copy. Set it to pin the name — that's what keeps the existing volumes after the
# directory moves. Same character rules as metarepo_id. Put it here to share it with
# the team, or in meta-repo.local.yaml for one checkout; the local file wins.
#metarepo_suffix: "1234"

# Optional. Who commits made inside the container are attributed to, as if
# `git config --global user.name` and `user.email` had been run. This overrides
# the host .gitconfig that VS Code copies in, which is the point when the
# container commits as an agent or bot account rather than as you. Set both keys
# or neither. Put it here to set it for the whole team, or in
# meta-repo.local.yaml for one person; the local file wins.
git:
  name: "blacksheep-bot"
  email: "bot@blacksheepcode.com"
# Folders under each person's `root` (set in meta-repo.local.yaml) that make up
# the meta-repo. Each is mounted at /workspace/<folder name>.
#
# separate_mounts are paths inside the folder that get a named volume instead
# of binding back to the host, e.g. node_modules, so macOS and Linux builds of
# dependencies don't conflict.
#
# ignore hides files from the container, e.g. secrets. Each entry is a glob:
# without a `/` it matches a name at any depth (`.env*`), with a `/` it matches
# the path from the folder root (`config/**/*.pem`), and a trailing `/` matches
# directories only. Matches are found when apply.sh runs, so re-run it after
# creating new files that should be hidden.
folders:
  - path: "agent-skills"
  - path: "pa"
  - path: "thunderjar"
    separate_mounts:
      - node_modules
  - path: "dotfiles"
  - path: "ai-experiments"
  - path: "thunderjar-evaluation-sandbox"




# Container directories kept across rebuilds, so tools don't need to be
# reinstalled each time. <volume name>: <container path>
persistent_volumes:
  tool-cache: /home/vscode/.cache
  persist: /workspace/persistence

# Environment variables the container expects. Declare the keys here and leave
# the values empty; each person sets the values in meta-repo.local.yaml.
env:
  THUNDERJAR_TRY_JS_DIR: /workspace/tj-js
  THUNDERJAR_TRY_NON_JS_DIR: /workspace/tj-nojs
